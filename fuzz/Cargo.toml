[package]
name = "htmlmark-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
htmlmark = { path = ".." }
pulldown-cmark = { version = "0.13", default-features = false }

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_back"
path = "fuzz_targets/read_back.rs"
test = false
doc = false
bench = false

# Built with nightly by cargo-fuzz, outside the repository's workspace.
[workspace]
members = ["."]
