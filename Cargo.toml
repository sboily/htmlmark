[package]
name = "htmlmark"
description = "Bounded, interruptible HTML to Markdown and text conversion for untrusted pages"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["html", "markdown", "converter", "untrusted", "bounded"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
html5ever = "0.40"

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }

[lints]
workspace = true
